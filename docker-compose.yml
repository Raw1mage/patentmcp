# patentmcp — per-user container (modeled on docxmcp's HTTP-over-UDS setup).
#
# Bring up:
#   cd vendor/patents-mcp
#   cp .env.example .env        # fill in your keys
#   docker compose -p patentmcp-${USER} up -d --build
#
# IPC rendezvous lives in the repo at vendor/patents-mcp/.run/patentmcp.sock
# (gitignored). The local opencode gateway connects there; register it via
# ~/.config/opencode/mcp-apps.json (see mcp.json) and as a web route /patentmcp.
#
# Secrets: API keys come from .env (compose reads it automatically). The GCP
# service-account JSON is the one file we must mount read-only — it cannot be
# baked into the image.

services:
  patentmcp:
    image: patentmcp:latest
    container_name: patentmcp
    build:
      # Repo root, so the image bakes in BOTH the server
      # and the skill tree (skills/) the download route serves.
      context: .
      dockerfile: Dockerfile
    # Dual transport (MCP integration standard R1.2 / bodesign precedent):
    #   --uds  → inward transport the same-host opencode daemon reaches via the
    #            ./.run bind mount (R1.1; this is what surfaces patentmcp_* tools).
    #   --port → additional outward TCP for direct IDE / cross-host access (R1.7),
    #            same MCP API. Both bound by ONE process (single app lifespan).
    command: ["--transport", "http", "--uds", "/run/patentmcp/patentmcp.sock", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      # IPC rendezvous (host ./.run holds the socket once uvicorn binds it).
      - "./.run:/run/patentmcp"
      # GCP service-account key, read-only. Override the host path via SA_KEY in .env.
      - "${SA_KEY:-${HOME}/.config/patents-mcp/sa-key.json}:/secrets/sa-key.json:ro"
      # Global patentdb (bibliographic sqlite + entity blobs) bind-mounted to
      # the repo tree so container-side writes (search absorb / download register)
      # and host-side landing scripts share ONE store. PATENTS_DB_ROOT (below)
      # pins the in-container path; without this pair the container wrote an
      # orphan /patentdb that silently vanished on rebuild.
      - "./patentdb:/patentdb"
      # Token store on a named volume so handles survive --force-recreate.
      # R14.5 (mcp-integration-standard): this volume + the DAV face wired into
      # build_app IS the per-host WebDAV working-cache provisioning. patentmcp's
      # auth provider is builtin-only (token-store-backed Basic auth,
      # _auth_provider.py — the AUTH_PROVIDER=builtin equivalent; no
      # gateway-backed variant exists, so no env switch is needed). Credential
      # bootstrap over the MCP rail: cache_provision(issue_webdav_credential
      # =true) — R14.6, rotate-on-call, default payload unchanged.
      - "patentmcp-sessions:/var/cache/patentmcp/sessions"
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # MCP/file config.
      PATENTS_GATEWAY_PREFIX: "/patentmcp"
      PATENTS_TOKEN_SESSIONS_ROOT: "/var/cache/patentmcp/sessions"
      PATENTS_TOKEN_TTL_SECONDS: "3600"
      PATENTS_TOKEN_SIZE_CAP_BYTES: "1073741824"
      # Global patentdb root — MUST match the ./patentdb bind mount above.
      PATENTS_DB_ROOT: "/patentdb"
      # Credentials — values from .env; the key path points at the mount above.
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/sa-key.json"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
      BIGQUERY_MAX_RESULTS: "${BIGQUERY_MAX_RESULTS:-1000}"
      BIGQUERY_MAX_BYTES_BILLED: "${BIGQUERY_MAX_BYTES_BILLED:-}"
      GPSS_USER_CODE: "${GPSS_USER_CODE:-}"
      EPO_CONSUMER_KEY: "${EPO_CONSUMER_KEY:-}"
      EPO_CONSUMER_SECRET: "${EPO_CONSUMER_SECRET:-}"
    restart: unless-stopped
    healthcheck:
      # Readiness = the inward UDS socket exists (docxmcp reference; standard
      # R8.3). This is the signal opencode's prerequisite gate actually depends
      # on to surface patentmcp_* tools — the TCP port being up is not sufficient.
      test: ["CMD", "test", "-S", "/run/patentmcp/patentmcp.sock"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 10s

volumes:
  patentmcp-sessions:
    driver: local
